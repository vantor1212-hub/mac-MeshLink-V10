
name: Build MeshLink V10 for macOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build macOS app
        shell: bash
        run: |
          if [ -f icon.icns ]; then
            python -m PyInstaller --noconfirm --clean --windowed --name "MeshLink V10" --osx-bundle-identifier com.meshlink.v10 --icon icon.icns MeshLinkV10.py
          else
            python -m PyInstaller --noconfirm --clean --windowed --name "MeshLink V10" --osx-bundle-identifier com.meshlink.v10 MeshLinkV10.py
          fi

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent "dist/MeshLink V10.app" MeshLinkV10-macOS.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshLink-V10-macOS
          path: MeshLinkV10-macOS.zip
